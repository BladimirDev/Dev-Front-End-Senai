<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <h1>Informações Pessoais</h1>
    <form action="">
        <fieldset>
            <legend>Cadastro Cliente</legend>
            <br>
            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o nome do cliente">
            </div>
            <br>
            <div>
                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" placeholder="Digite a idade">
            </div>
            <br>
            <div>
                <label for="endereco">Endereço:</label>
                <br>
                <input type="text" id="endereco" name="endereco" placeholder="Digite o endereço">
            </div>
            <br>
            <div>
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" placeholder="Digite a cidade">
            </div>
            <br>
            <div>
                <label for="estado">Estado:</label>
                <input type="text" id="estado" name="estado" placeholder="UF" size="1">
            </div>
            <br>
            <div>
                <label for="cep">CEP:</label>
                <input type="number" id="cep" name="cep" placeholder="XXXXX-XXX">
            </div>
            <br>
            <div>
                <label for="telefone">Tel/Res:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="99 99999-9999">
            </div>
            <br>
            <div>
                <label for="cel">Tel/Cel</label>
                <input type="tel" id="cel" name="cel" placeholder="99 99999-9999">
            </div>
            <br>
            <div>
                <label for="email">Email:</label>
                <br>
                <input type="email" id="email" name="email" placeholder="Digite o endereço de email">
            </div>
            <br>
        </fieldset>
    </form>
    <button><a href="index.html">Enviar</a></button>
</body>
</html>
